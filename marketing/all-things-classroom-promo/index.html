<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All Things Classroom — Promo</title>
<style>
@font-face { font-family: 'Unbounded'; font-weight: 700; src: url(fonts/unbounded-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Unbounded'; font-weight: 800; src: url(fonts/unbounded-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: 'Unbounded'; font-weight: 900; src: url(fonts/unbounded-latin-900-normal.woff2) format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url(fonts/space-grotesk-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 600; src: url(fonts/space-grotesk-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(fonts/space-grotesk-latin-700-normal.woff2) format('woff2'); }

html, body { margin: 0; padding: 0; background: #000; }
#stage {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: #0F0C24; font-family: 'Space Grotesk', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; visibility: hidden; }
.abs { position: absolute; left: 0; top: 0; }
.txt { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; }
.mask { overflow: hidden; padding: 0.08em 0.04em 0.14em; }
.ch { display: inline-block; will-change: transform; }
.tile { display: flex; align-items: center; justify-content: center; }
#vignette { background: radial-gradient(ellipse 75% 60% at 50% 50%, transparent 55%, rgba(0,0,0,.35) 100%); }
#grain { mix-blend-mode: overlay; opacity: .09; background-size: 256px 256px; }
.blob { position: absolute; left: 0; top: 0; border-radius: 50%;
  background: radial-gradient(circle closest-side, currentColor 0%, transparent 100%); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="cam" class="layer"></div>
  <canvas id="confetti" class="layer" width="1080" height="1920"></canvas>
  <div id="vignette" class="layer"></div>
  <div id="fx" class="layer"></div>
  <div id="grain" class="layer"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="icons.js"></script>
<script src="main.js"></script>
</body>
</html>

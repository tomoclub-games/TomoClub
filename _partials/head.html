    <script>
      // Old hash routes (/#pd, /#podcast, ...) now live at real URLs. Send visitors there.
      (function () {
        var routes = {
          '#home': '/', '#ai-literacy': '/ai-literacy', '#future-ready': '/future-ready',
          '#pd': '/professional-development', '#guides': '/guides', '#education-hall': '/education-hall',
          '#podcast': '/podcast', '#results': '/results', '#faqs': '/faqs', '#about': '/about',
          '#blog': '/blog', '#ebook': '/leaders-of-tomorrow'
        };
        function go() {
          var target = routes[location.hash];
          var here = location.pathname.replace(/\/(index\.html)?$/, '') || '/';
          if (target && target !== here) location.replace(target);
        }
        go();
        window.addEventListener('hashchange', go);
      })();
    </script>

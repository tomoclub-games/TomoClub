
    <!-- Download Modal has been moved to its own page -->

    <!-- Contextual Floating CTA -->
    <a href="/contact-us" id="floating-cta" class="btn btn-primary floating-cta">Contact Us <i data-lucide="arrow-right"></i></a>

    <!-- Video Modal -->
    <div id="video-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; flex-direction: column;">
        <button id="close-modal" style="position: absolute; top: 2rem; right: 2rem; background: transparent; border: none; color: white; cursor: pointer;"><i data-lucide="x" style="width: 32px; height: 32px;"></i></button>
        <div style="position: relative; width: 90%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden;">
            <iframe id="video-iframe" src="" style="width: 100%; height: 100%; border: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Article Modal -->
    <div id="article-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 800px; text-align: left; max-height: 90vh; overflow-y: auto; padding-top: 4rem;">
            <button class="modal-close" id="close-article-btn" style="position: fixed; top: 1.5rem; right: 1.5rem; z-index: 10;"><i data-lucide="x"></i></button>
            <span id="article-modal-date" style="font-size: 0.85rem; color: var(--teal); font-weight: 600; text-transform: uppercase; margin-bottom: 1rem; display: block;"></span>
            <h2 id="article-modal-title" style="margin-bottom: 2rem;"></h2>
            <div id="article-modal-body" class="article-body"></div>
        </div>
    </div>

    <!-- Download Modal -->
    <div id="download-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="close-download-btn"><i data-lucide="x"></i></button>
            <div style="margin-bottom: 2rem;">
                <div id="modal-icon" style="width: 64px; height: 64px; background: rgba(42, 180, 184, 0.1); color: var(--teal); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 1.5rem;">
                    <i data-lucide="download"></i>
                </div>
                <h3 id="modal-download-title" style="margin-bottom: 0.5rem;">Download Guide</h3>
                <p style="font-size: 1rem; color: var(--text-muted);">Enter your details to receive the PDF.</p>
            </div>
            
            <form id="toolkit-download-form">
                <input type="hidden" id="form-file-name" name="fileName">
                <input type="hidden" id="form-toolkit-name" name="toolkitName">
                <input type="hidden" name="sheetName" value="Sheet 2">
                <input type="hidden" name="source" value="Guides and Toolkits Section">
                
                <div class="form-group">
                    <label class="form-label" for="toolkit-name">Full Name</label>
                    <input type="text" id="toolkit-name" name="firstName" class="form-control" placeholder="Jane Doe" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="toolkit-email">Work Email</label>
                    <input type="email" id="toolkit-email" name="email" class="form-control" placeholder="jane@school.org" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Get My Guide <i data-lucide="arrow-right"></i>
                </button>
                <p style="font-size: 0.8rem; color: var(--text-light); margin-top: 1rem;">By downloading, you agree to receive future updates from TomoClub.</p>
            </form>

            <div id="download-success-msg" style="display: none;">
                <div style="color: var(--teal); margin-bottom: 1.5rem;">
                    <i data-lucide="check-circle" style="width: 48px; height: 48px;"></i>
                </div>
                <h4>Thank you!</h4>
                <p>Your download should start automatically. If not, <a href="#" id="manual-download-link" style="color: var(--teal); font-weight: 600; text-decoration: underline;">click here</a>.</p>
            </div>
        </div>
    </div>

<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Waitlist</title>
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style type="text/css">
      html { margin: 0; height: 100%; overflow: hidden; }
      iframe { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border: 0; }
    </style>
  </head>
  <body>
    <iframe data-tally-src="https://tally.so/r/gDgLeN?transparentBackground=1" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0" title="Waitlist"></iframe>
  
    <script>
      // Automatically pass all query parameters to the Tally form
      document.addEventListener('DOMContentLoaded', function() {
        const iframe = document.querySelector('iframe');
        if(iframe) {
            const originalSrc = iframe.getAttribute('data-tally-src') || iframe.src;
            const url = new URL(originalSrc, window.location.origin);
            const params = new URLSearchParams(window.location.search);
            
            // Tally sometimes expects 'pageUrl' or similar for the website page
            params.set('pageUrl', window.location.href);
            
            for (const [key, value] of params.entries()) {
                url.searchParams.set(key, value);
            }
            
            iframe.setAttribute('data-tally-src', url.toString());
            // also update src directly in case embed.js has already run or doesn't run
            iframe.src = url.toString();
        }
      });
    </script>
  </body>
</html>
